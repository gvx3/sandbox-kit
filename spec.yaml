schemaVersion: "2"
kind: sandbox
name: pi           
displayName: pi-coding-agent
description: "Customized pi agent"


sandbox:
  image: docker/sandbox-templates:shell-docker
  entrypoint: ["/bin/bash", "-c"]
  command:
    - |
      set -e
      if [ ! -f /tmp/.pi-setup-complete ]; then
        echo "First run: Installing Pi extensions..."
        pi install npm:@dietrichgebert/ponytail
        pi install npm:pi-web-access
        pi install npm:pi-subagents
        pi install npm:billion-context
        touch /tmp/.pi-setup-complete
      else
        echo "Setup already complete. Skipping installation."
      fi
      exec pi
  resources:                                   
    cpu: 2
    memory: 2g

credentials:
  - service: deepseek-service
    apiKey:
      name: DEEPSEEK_API_KEY
      proxyManaged: true
      inject:
        - domain: api.deepseek.com
          scheme: bearer

permissions:
  network:
    allow:
      - "trivy.dev"
      - "registry.npmjs.org"
      - "api.deepseek.com"
      - "pi.dev"
      - "deb.debian.org"

setup:
  install:
    - command: "npm install -g --ignore-scripts @earendil-works/pi-coding-agent"
      description: Install pi-coding-agent if the image doesn't already provide it


